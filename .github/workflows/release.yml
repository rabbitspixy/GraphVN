name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 0.1.0, without leading v)'
        required: true
        type: string
      build_number:
        description: 'Build number (e.g. 1)'
        required: true
        type: string
      prerelease:
        description: 'Mark as a prerelease'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  verify:
    name: Verify version consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check versions in pubspec.yaml and app_version.dart
        shell: bash
        run: |
          FULL_VERSION="${{ inputs.version }}+${{ inputs.build_number }}"
          if ! grep -qF "version: $FULL_VERSION" pubspec.yaml; then
            echo "::error::pubspec.yaml does not contain 'version: $FULL_VERSION'"
            exit 1
          fi
          if ! grep -qF "Version.parse(\"$FULL_VERSION\")" lib/app_version.dart; then
            echo "::error::app_version.dart does not contain 'Version.parse(\"$FULL_VERSION\")'"
            exit 1
          fi
          echo "Version check OK: $FULL_VERSION"

  build:
    name: Build ${{ matrix.name }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            platform: windows-x64
            archive_ext: zip
          - name: Linux
            os: ubuntu-latest
            platform: linux-x64
            archive_ext: tar.gz

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev \
            libudev-dev libusb-1.0-0-dev libevdev-dev \
            default-jdk-headless protobuf-compiler

      - name: Install protoc (Windows)
        if: runner.os == 'Windows'
        run: choco install protoc -y --no-progress

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code (dart_mappable)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Generate protobuf code (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force lib/generated-proto | Out-Null
          protoc --dart_out=lib/generated-proto/ data.proto --plugin=protoc-gen-dart=tool\protoc-gen-dart.bat

      - name: Generate protobuf code (Linux)
        if: runner.os == 'Linux'
        run: |
          chmod +x tool/protoc-gen-dart
          mkdir -p lib/generated-proto
          protoc --plugin=protoc-gen-dart=tool/protoc-gen-dart --dart_out=lib/generated-proto/ data.proto

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: flutter build windows --release --build-name=${{ inputs.version }} --build-number=${{ inputs.build_number }}

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: |
          flutter build linux --release --build-name=${{ inputs.version }} --build-number=${{ inputs.build_number }}
          cp -f build/linux/x64/release/plugins/flutter_js/bundle/lib/libquickjs_c_bridge_plugin.so build/linux/x64/release/bundle/lib/

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Rename-Item -Path "build\windows\x64\runner\Release" -NewName "GraphVN-${{ inputs.version }}-windows-x64"
          Compress-Archive -Path "build\windows\x64\runner\GraphVN-${{ inputs.version }}-windows-x64" -DestinationPath "dist\GraphVN-${{ inputs.version }}-windows-x64.zip" -Force

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          mv build/linux/x64/release/bundle "build/linux/x64/release/GraphVN-${{ inputs.version }}-linux-x64"
          tar -czf "dist/GraphVN-${{ inputs.version }}-linux-x64.tar.gz" -C "build/linux/x64/release/GraphVN-${{ inputs.version }}-linux-x64" .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GraphVN-${{ inputs.version }}-${{ matrix.platform }}.${{ matrix.archive_ext }}
          path: dist/GraphVN-${{ inputs.version }}-${{ matrix.platform }}.${{ matrix.archive_ext }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: GraphVN v${{ inputs.version }}
          body: |
            GraphVN **v${{ inputs.version }}**

            Portable builds:
            - `GraphVN-${{ inputs.version }}-windows-x64.zip`
            - `GraphVN-${{ inputs.version }}-linux-x64.tar.gz`
          files: artifacts/**/*
          prerelease: ${{ inputs.prerelease }}
